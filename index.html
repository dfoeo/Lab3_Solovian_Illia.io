<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Photo archive · Солов'ян Ілля</title>
<style>
*{box-sizing:border-box}
body{
  margin:0;
  color:#edece6;
  background:#111310;
  font-family:Arial,Helvetica,sans-serif;
}
main{
  width:min(1160px,calc(100% - 44px));
  margin:auto;
  padding:48px 0 70px;
}
header{
  display:grid;
  grid-template-columns:1fr auto;
  align-items:end;
  padding-bottom:20px;
  border-bottom:1px solid #3b403a;
  margin-bottom:22px;
}
.kicker{
  font-size:11px;
  letter-spacing:.2em;
  color:#a7aaa3;
  text-transform:uppercase;
}
h1{
  margin:8px 0 0;
  font:500 42px Georgia,serif;
}
.meta{
  color:#b5b8b1;
  text-align:right;
  line-height:1.5;
}
.grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:14px;
}
figure{
  margin:0;
  border:1px solid #373c36;
  background:#191c18;
}
img{
  display:block;
  width:100%;
  height:255px;
  object-fit:cover;
}
figcaption{
  padding:11px 13px;
  color:#aeb0aa;
  font-size:11px;
  letter-spacing:.12em;
}
@media(max-width:850px){
  .grid{grid-template-columns:1fr 1fr}
}
</style>
</head>
<body>
<main>
<header>
  <div>
    <div class="kicker">remote repository / practical 1.4</div>
    <h1>Photo archive</h1>
  </div>
  <div class="meta">Солов'ян Ілля<br>group 42</div>
</header>
<section class="grid">

<figure>
  <img src="images/album_01.svg" alt="Фото 1">
  <figcaption>FRAME 01</figcaption>
</figure>

<figure>
  <img src="images/album_02.svg" alt="Фото 2">
  <figcaption>FRAME 02</figcaption>
</figure>

<figure>
  <img src="images/album_03.svg" alt="Фото 3">
  <figcaption>FRAME 03</figcaption>
</figure>

<figure>
  <img src="images/album_04.svg" alt="Фото 4">
  <figcaption>FRAME 04</figcaption>
</figure>

<figure>
  <img src="images/album_05.svg" alt="Фото 5">
  <figcaption>FRAME 05</figcaption>
</figure>

<figure>
  <img src="images/album_06.svg" alt="Фото 6">
  <figcaption>FRAME 06</figcaption>
</figure>

</section>
</main>
</body>
</html>
